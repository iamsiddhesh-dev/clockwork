<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 870" width="1020" height="870" role="img" aria-label="Clockwork architecture. Three triggers wake the Strands agent through run_agent: a client writing in through the public intake form, the freelancer pasting a client's reply into a conversation, and a scheduler tick that runs every 30 seconds locally and every 5 minutes on Vercel through a GitHub Action. The freelancer's own buttons (setup, find leads, score, pitch, quote, invoice, chase) call the same tool code directly without the agent loop, and each is still recorded as a run. Job feeds from Hacker News, Remotive and RemoteOK, and the freelancer's GitHub and portfolio site, are read by those buttons. The Strands agent has 12 typed tools, Pydantic structured output, lifecycle hooks and a retry for rate-limited model calls. Models are routed by role on Groq through LiteLLM: orchestrator and reader on gpt-oss-120b, writer and extractor on gpt-oss-20b. Everything is stored in Supabase Postgres, with every step, tool call, token count and cost in agent_event and token_ledger, replayed in the Run Trace. Approval-gated tools cannot send: they write a pending approval row, the freelancer approves in the Approval Inbox, and only then does the executor record the action as sent. No email is transmitted. The money tail runs quote, human acceptance, invoice, an escalating payment chase, and human confirmation of payment; totals are computed in Python and no step can move money. A virtual clock lets the demo advance days ahead.">
  <style>
    .bg    { fill: #ffffff; }
    .box   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .box-accent { fill: #fff8e6; stroke: #d4a72c; stroke-width: 2; }
    .box-live   { fill: #eaf6ec; stroke: #4a9a5e; stroke-width: 2; }
    .box-gate   { fill: #fdf0ee; stroke: #c4664d; stroke-width: 2; }
    .t       { fill: #1f2328; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .title   { font-size: 14px; font-weight: 600; }
    .sub     { font-size: 11px; fill: #59636e; }
    .tiny    { font-size: 10px; fill: #59636e; }
    .lbl     { font-size: 10.5px; fill: #59636e; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .hdr     { font-size: 11px; font-weight: 700; fill: #59636e; letter-spacing: .08em; }
    .line    { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .line-gate { stroke: #c4664d; stroke-width: 2; fill: none; }
    .rule    { stroke: #b0b7be; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .box   { fill: #161b22; stroke: #30363d; }
      .box-accent { fill: #2b2413; stroke: #d4a72c; }
      .box-live   { fill: #12261a; stroke: #4a9a5e; }
      .box-gate   { fill: #2b1a16; stroke: #c4664d; }
      .t     { fill: #e6edf3; }
      .sub, .tiny, .lbl, .hdr { fill: #8b949e; }
      .line  { stroke: #6e7681; }
      .rule  { stroke: #484f58; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4664d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1020" height="870"/>

  <!-- ===== TRIGGERS ===== -->
  <text class="t hdr" x="20" y="30">TRIGGERS — wake the agent</text>

  <g>
    <rect class="box" x="20" y="44" width="190" height="48" rx="6"/>
    <text class="t title" x="34" y="64">Client writes in</text>
    <text class="t sub" x="34" y="81">public intake form</text>
  </g>

  <g>
    <rect class="box" x="20" y="100" width="190" height="48" rx="6"/>
    <text class="t title" x="34" y="120">You paste their reply</text>
    <text class="t sub" x="34" y="137">on a conversation</text>
  </g>

  <g>
    <rect class="box-accent" x="20" y="156" width="190" height="64" rx="6"/>
    <text class="t title" x="34" y="176">Scheduler tick</text>
    <text class="t sub" x="34" y="193">every 30s locally; every 5 min</text>
    <text class="t sub" x="34" y="207">on Vercel via a GitHub Action</text>
  </g>
  <text class="t tiny" x="20" y="236">a tick runs due tasks, no human present</text>

  <path class="line" d="M210 68 L 222 68 L 222 188 L 210 188"/>
  <path class="line" d="M210 124 L 222 124"/>
  <path class="line" d="M222 133 L 232 133" marker-end="url(#a)"/>

  <!-- ===== INPUTS ===== -->
  <text class="t hdr" x="20" y="276">INPUTS</text>

  <g>
    <rect class="box" x="20" y="288" width="196" height="64" rx="6"/>
    <text class="t title" x="34" y="308">Job feeds</text>
    <text class="t sub" x="34" y="325">Hacker News, Remotive, RemoteOK</text>
    <text class="t sub" x="34" y="339">each link checked before scoring</text>
  </g>

  <g>
    <rect class="box" x="20" y="360" width="190" height="50" rx="6"/>
    <text class="t title" x="34" y="380">Your GitHub + site</text>
    <text class="t sub" x="34" y="397">read once at setup</text>
  </g>

  <path class="line" d="M216 320 L 222 320 L 222 385 L 210 385"/>
  <path class="line" d="M222 290 L 222 320"/>
  <path class="line" d="M222 290 L 232 290" marker-end="url(#a)"/>

  <!-- ===== ENTRY POINTS ===== -->
  <g>
    <rect class="box" x="236" y="96" width="190" height="74" rx="6"/>
    <text class="t title" x="331" y="122" text-anchor="middle">run_agent()</text>
    <text class="t sub" x="331" y="140" text-anchor="middle">the full agent loop</text>
    <text class="t sub" x="331" y="155" text-anchor="middle">opens an agent_run</text>
  </g>

  <g>
    <rect class="box-accent" x="236" y="224" width="190" height="96" rx="6"/>
    <text class="t title" x="250" y="246">Your buttons</text>
    <text class="t sub" x="250" y="264">set up, find leads, score,</text>
    <text class="t sub" x="250" y="278">pitch, quote, invoice, chase</text>
    <text class="t sub" x="250" y="296">call the tool code directly,</text>
    <text class="t sub" x="250" y="310">no agent loop; logged as a run</text>
  </g>

  <!-- ===== STRANDS AGENT ===== -->
  <path class="line" d="M426 133 L 462 133" marker-end="url(#a)"/>
  <path class="line" d="M426 272 L 446 272 L 446 176 L 462 176" marker-end="url(#a)"/>
  <text class="t lbl" x="440" y="206" text-anchor="end">same tools</text>

  <g>
    <rect class="box" x="466" y="92" width="210" height="100" rx="6"/>
    <text class="t title" x="571" y="116" text-anchor="middle">Strands Agent</text>
    <text class="t sub" x="571" y="135" text-anchor="middle">12 typed @tools</text>
    <text class="t sub" x="571" y="150" text-anchor="middle">Pydantic structured output</text>
    <text class="t sub" x="571" y="165" text-anchor="middle">lifecycle hooks → audit trail</text>
    <text class="t sub" x="571" y="180" text-anchor="middle">retries a rate-limited model call</text>
  </g>

  <!-- ===== MODEL ROUTER ===== -->
  <text class="t hdr" x="466" y="222">MODELS BY ROLE — Groq via LiteLLM</text>
  <path class="line" d="M571 228 L 571 246" marker-end="url(#a)"/>

  <g>
    <rect class="box-live" x="466" y="250" width="210" height="40" rx="6"/>
    <text class="t title" x="480" y="267">ORCHESTRATOR · 120b</text>
    <text class="t sub" x="480" y="282">runs the agent loop, picks tools</text>
  </g>
  <g>
    <rect class="box" x="466" y="296" width="210" height="40" rx="6"/>
    <text class="t title" x="480" y="313">READER · 120b</text>
    <text class="t sub" x="480" y="328">reads GitHub and portfolio</text>
  </g>
  <g>
    <rect class="box" x="466" y="342" width="210" height="40" rx="6"/>
    <text class="t title" x="480" y="359">WRITER · 20b</text>
    <text class="t sub" x="480" y="374">pitches, replies, quotes, reminders</text>
  </g>
  <g>
    <rect class="box" x="466" y="388" width="210" height="40" rx="6"/>
    <text class="t title" x="480" y="405">EXTRACTOR · 20b</text>
    <text class="t sub" x="480" y="420">fit scores, qualifying, requirements</text>
  </g>
  <text class="t tiny" x="466" y="446">120b = openai/gpt-oss-120b · 20b = openai/gpt-oss-20b. Past the daily spend cap, the orchestrator uses 20b.</text>

  <!-- ===== DATA ===== -->
  <path class="line" d="M676 133 L 726 133" marker-end="url(#a)"/>

  <g>
    <rect class="box" x="730" y="92" width="270" height="100" rx="6"/>
    <text class="t title" x="744" y="116">Supabase Postgres</text>
    <text class="t sub" x="744" y="135">profile · opportunity · thread · message</text>
    <text class="t sub" x="744" y="150">deal · quote · invoice · approval · task</text>
    <text class="t sub" x="744" y="165">every row scoped to one workspace id</text>
  </g>

  <path class="line" d="M865 192 L 865 236" marker-end="url(#a)"/>
  <text class="t lbl" x="872" y="218">logs</text>

  <g>
    <rect class="box" x="730" y="240" width="270" height="66" rx="6"/>
    <text class="t title" x="744" y="262">agent_event · token_ledger</text>
    <text class="t sub" x="744" y="280">each step, tool call, tokens and cost</text>
    <text class="t sub" x="744" y="295">replayed live in the Run Trace</text>
  </g>

  <!-- ===== APPROVAL GATE ===== -->
  <line class="rule" x1="20" y1="474" x2="1000" y2="474"/>
  <text class="t hdr" x="20" y="502">THE APPROVAL GATE — enforced in code, not prompting</text>

  <g>
    <rect class="box-gate" x="20" y="516" width="196" height="70" rx="6"/>
    <text class="t title" x="34" y="539">draft_reply / draft_pitch</text>
    <text class="t sub" x="34" y="557">writes text, cannot send</text>
    <text class="t sub" x="34" y="572">returns "queued"</text>
  </g>

  <path class="line-gate" d="M216 551 L 262 551" marker-end="url(#ag)"/>

  <g>
    <rect class="box-gate" x="266" y="516" width="180" height="70" rx="6"/>
    <text class="t title" x="280" y="539">approval row</text>
    <text class="t sub" x="280" y="557">status: pending</text>
    <text class="t sub" x="280" y="572">what · why · read · changes</text>
  </g>

  <path class="line-gate" d="M446 551 L 492 551" marker-end="url(#ag)"/>

  <g>
    <rect class="box-accent" x="496" y="516" width="180" height="70" rx="6"/>
    <text class="t title" x="510" y="539">You</text>
    <text class="t sub" x="510" y="557">Approval Inbox</text>
    <text class="t sub" x="510" y="572">approve / reject / edit</text>
  </g>

  <path class="line-gate" d="M676 551 L 722 551" marker-end="url(#ag)"/>
  <text class="t lbl" x="701" y="604" text-anchor="middle">only on approve</text>

  <g>
    <rect class="box" x="726" y="516" width="274" height="70" rx="6"/>
    <text class="t title" x="740" y="539">executor.py</text>
    <text class="t sub" x="740" y="557">records it as sent</text>
    <text class="t sub" x="740" y="572">quotes and invoices arm a check-in</text>
  </g>

  <text class="t tiny" x="20" y="622">An approval-gated tool has no code path that sends. No email is transmitted yet: you send an approved message from the job board or your own inbox.</text>

  <!-- ===== THE MONEY TAIL ===== -->
  <line class="rule" x1="20" y1="646" x2="1000" y2="646"/>
  <text class="t hdr" x="20" y="674">THE MONEY TAIL</text>

  <g>
    <rect class="box-gate" x="20" y="688" width="180" height="62" rx="6"/>
    <text class="t title" x="32" y="710">draft_quote *</text>
    <text class="t sub" x="32" y="727">line items from the model</text>
    <text class="t sub" x="32" y="741">totals computed in Python</text>
  </g>
  <path class="line" d="M200 719 L 212 719" marker-end="url(#a)"/>

  <g>
    <rect class="box-accent" x="215" y="688" width="180" height="62" rx="6"/>
    <text class="t title" x="227" y="710">You: accepted?</text>
    <text class="t sub" x="227" y="727">human-only — no tool</text>
    <text class="t sub" x="227" y="741">can record this for you</text>
  </g>
  <path class="line" d="M395 719 L 407 719" marker-end="url(#a)"/>

  <g>
    <rect class="box-gate" x="410" y="688" width="180" height="62" rx="6"/>
    <text class="t title" x="422" y="710">draft_invoice *</text>
    <text class="t sub" x="422" y="727">refuses unless accepted</text>
    <text class="t sub" x="422" y="741">number + due date computed</text>
  </g>
  <path class="line" d="M590 719 L 602 719" marker-end="url(#a)"/>

  <g>
    <rect class="box-gate" x="605" y="688" width="180" height="62" rx="6"/>
    <text class="t title" x="617" y="710">chase_payment *</text>
    <text class="t sub" x="617" y="727">tone escalates each time</text>
    <text class="t sub" x="617" y="741">does nothing if paid or not due</text>
  </g>
  <path class="line" d="M785 719 L 797 719" marker-end="url(#a)"/>

  <g>
    <rect class="box-live" x="800" y="688" width="180" height="62" rx="6"/>
    <text class="t title" x="812" y="710">You: paid</text>
    <text class="t sub" x="812" y="727">cancels the chase task</text>
    <text class="t sub" x="812" y="741">deal closes as won</text>
  </g>

  <text class="t tiny" x="20" y="774">* goes through the same approval gate above. There is no payment processor: no step here can move money.</text>

  <!-- ===== VIRTUAL CLOCK ===== -->
  <line class="rule" x1="20" y1="798" x2="1000" y2="798"/>
  <text class="t hdr" x="20" y="826">VIRTUAL CLOCK</text>
  <text class="t sub" x="132" y="826">every time read goes through clock.now() — advance it days ahead and the follow-up and payment-chase checks fire in seconds</text>
</svg>
