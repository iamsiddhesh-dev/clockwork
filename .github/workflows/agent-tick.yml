name: Agent tick

# The deployed agent runs on Vercel, which has no long-lived process for the
# 30-second scheduler to live in, and the free Vercel plan only runs cron
# once a day. So this wakes the agent from outside: every few minutes it
# calls POST /tasks/tick, which drains whatever follow-ups and payment
# chases have come due -- the same thing the local timer does.
#
# GitHub may start a scheduled run several minutes late under load, and
# 5 minutes is the shortest interval it allows. For follow-ups measured in
# days that is plenty.
#
# Needs two repository secrets:
#   AGENT_API_URL  the deployed API, e.g. https://clockwork-api.vercel.app
#   CRON_SECRET    the same value as the API project's CRON_SECRET variable
# Until both exist, runs skip with a notice instead of failing every time.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # run by hand to check the wiring

concurrency:
  # Never stack ticks. The API claims each task atomically, so an overlap
  # would not double-run anything, but it would waste a run.
  group: agent-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /tasks/tick
        env:
          AGENT_API_URL: ${{ secrets.AGENT_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$AGENT_API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::AGENT_API_URL / CRON_SECRET secrets not set yet -- skipping."
            exit 0
          fi

          url="${AGENT_API_URL%/}/tasks/tick"
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 310 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$url")

          echo "HTTP $status"
          cat /tmp/body.txt | head -c 2000; echo
          if [ "$status" != "200" ]; then
            echo "::error::Tick failed with HTTP $status"
            exit 1
          fi
